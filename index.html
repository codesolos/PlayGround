</style></head><body><div id="app"></div><div class="grain"></div><script>
const TEAMS=[['Apex GP','#e84c3d',[72,73,74,70,48,50,72,78,61]],['Vortex Racing','#66c9cb',[86,83,82,78,51,48,82,80,73]],['Scuderia Veloci','#df413b',[91,89,86,85,45,43,88,85,76]],['Northstar','#a9c9e6',[81,80,84,87,40,44,81,91,84]],['Titan Motorsport','#e8ca44',[78,82,75,72,66,62,75,77,69]],['Pacific Works','#5798db',[76,77,80,78,47,51,77,82,79]],['Redline','#ec7c42',[73,74,71,68,61,55,70,74,64]],['Emerald Racing','#66b56b',[69,72,76,79,46,53,74,86,82]],['Orion','#c285ce',[83,78,78,77,54,48,80,79,70]],['Midland','#a7a89c',[67,68,69,72,50,57,68,81,75]]].map(([name,color,a])=>({name,color,car:Object.fromEntries(['speed','accel','corner','stability','over','under','brake','reliability','wear'].map((k,i)=>[k,a[i]]))}));
const TRACKS=[['Silverstone','United Kingdom',5.89,52,'FAST • WINDY'],['Monza','Italy',5.79,53,'TEMPLE OF SPEED'],['Suzuka','Japan',5.81,54,'TECHNICAL • FLOWING'],['Monaco','Monaco',3.34,78,'TIGHT • LOW GRIP'],['Interlagos','Brazil',4.31,71,'ELEVATION • CHANGEABLE'],['Spa-Francorchamps','Belgium',6.97,61,'LONG • UNPREDICTABLE'],['Sepang','Malaysia',5.54,56,'HOT • HUMID'],['A1-Ring','Austria',4.32,69,'ELEVATION • HEAVY BRAKING'],['Hockenheim','Germany',6.82,58,'LONG STRAIGHTS'],['Magny-Cours','France',4.25,72,'SMOOTH • TECHNICAL'],['Nürburgring','Germany',5.15,60,'MIXED • COOL'],['Adelaide','Australia',3.78,67,'STREET CIRCUIT']];const ATTRS=['pace','qualifying','aggression','overtaking','defending','consistency','wet','tyres','mistakes'];const NAMES=['Kai Mercer','Luca Moretti','Sofia Laurent','Theo Varga','Mika Sato','Nina Costa','Elias Berg','Jules Perrin','Rafa Silva','Tomas Novak','Iris Chen','Matteo Rizzo','Finn Adler','Noah Price','Yuki Tanaka','Alex Dupont','Enzo Rossi','Mara Olsen','Victor Cruz','Leo Weber'];const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,clamp=(n,a,b)=>Math.max(a,Math.min(b,n)),initials=n=>n.split(' ').map(x=>x[0]).join('');
function makeDrivers(){let all=[];TEAMS.forEach((t,ti)=>{for(let j=0;j<2;j++){let base=ti===2?83:ti===1?79:ti===9?65:rnd(68,79),d={name:NAMES[ti*2+j],team:ti,age:rnd(21,36),rating:base,experience:rnd(0,8),points:0,wins:0,podiums:0,retired:false,attrs:{}};ATTRS.forEach(a=>d.attrs[a]=clamp(base+rnd(-14,13),22,98));all.push(d)}});return all}function fresh(){return{season:2001,round:0,player:null,drivers:makeDrivers(),history:[],view:'home'}}let state;try{state=JSON.parse(localStorage.getItem('gridline-save'))||fresh()}catch(e){state=fresh()}if(!state.drivers||state.drivers.length<20)state=fresh();function save(){localStorage.setItem('gridline-save',JSON.stringify(state))}const $=s=>document.querySelector(s);
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function standingsRows(list){return list.map((d,i)=>`<tr><td class="pos">${String(i+1).padStart(2,'0')}</td><td><span class="team-dot" style="background:${TEAMS[d.team].color}"></span><span class="driver-name">${esc(d.name)}${d===state.player?' <b style="color:var(--lime)">(YOU)</b>':''}</span><span class="team-name">${TEAMS[d.team].name}</span></td><td class="points">${d.points}</td></tr>`).join('')}
function homePage(){return `<div class="hero"><div><div class="eyebrow">A new era begins · 2001 season</div><h1>Earn your<br><em>place on the grid.</em></h1><div class="subline">Ten teams. Twenty seats. One career built from nothing.</div></div><div class="pill">CAREER MODE / SINGLE PLAYER</div></div><div class="layout"><section><div class="panel"><div class="panel-head"><div class="panel-title">The paddock is waiting</div><span class="eyebrow">12 ROUNDS</span></div><div class="panel-body"><div class="track-card"><div class="track-name">A world of racing</div><div class="track-meta" style="position:absolute;left:22px;top:55px">2001 FIA WORLD CHAMPIONSHIP</div><svg class="track-svg" viewBox="0 0 300 210"><path d="M42 133 C15 115 45 64 80 70 C105 74 105 107 135 107 C168 107 166 48 203 44 C242 40 270 81 246 105 C222 130 183 113 180 147 C177 178 230 180 255 155 C273 138 263 112 248 105"/><path class="inside" d="M42 133 C15 115 45 64 80 70 C105 74 105 107 135 107 C168 107 166 48 203 44 C242 40 270 81 246 105 C222 130 183 113 180 147 C177 178 230 180 255 155 C273 138 263 112 248 105"/></svg><div class="event-info"><div class="event-number">01</div><div class="weather">12 GRAND PRIX<br>ONE WORLD TITLE<br>YOUR STORY STARTS HERE</div></div></div><div class="stats-row"><div class="statbox"><label>Teams</label><strong>10</strong><span>Independent outfits</span></div><div class="statbox"><label>Drivers</label><strong>20</strong><span>Two per team</span></div><div class="statbox"><label>Grand Prix</label><strong>12</strong><span>Around the globe</span></div><div class="statbox"><label>Grid</label><strong>20</strong><span>Earn your seat</span></div></div><button class="btn race-cta" id="create">Create your driver <span style="float:right">→</span></button></div></div></section><aside><div class="panel"><div class="panel-head"><div class="panel-title">The challenge</div></div><div class="panel-body"><p style="font-size:13px;line-height:1.75;color:#b1bbb6;margin:0 0 20px">The paddock has noticed you. Build a reputation, beat your teammate and climb the ladder—one race at a time.</p><div class="attribute"><span>DRIVER DEVELOPMENT</span><div class="bar"><i style="width:75%"></i></div><b>ON</b></div><div class="attribute"><span>TEAM CONTRACTS</span><div class="bar"><i style="width:88%"></i></div><b>ON</b></div><div class="attribute"><span>LIVE RACE SIM</span><div class="bar"><i style="width:100%"></i></div><b>ON</b></div><div style="border-top:1px solid #354144;margin-top:18px;padding-top:16px;font:10px 'DM Mono';line-height:1.8;color:#899691">RACE CONTROLS<br><span style="color:#e2e8dd">← → steer · ↑ accelerate · ↓ brake<br>SPACE handbrake · C cockpit view</span></div></div></div><div style="margin-top:14px;padding:14px 16px;border:1px solid #354144;font:10px 'DM Mono';line-height:1.7;color:#9ba7a2">YOUR DRIVER. YOUR CALLS.<br><span style="color:#e5e9dd">Every team has a different car. Your ability is yours alone.</span></div></aside></div>`}
function careerPage(){let p=state.player,t=TEAMS[p.team],track=TRACKS[state.round%12],ordered=[...state.drivers].sort((a,b)=>b.points-a.points),mate=state.drivers.find(d=>d.team===p.team&&d!==p);return `<div class="hero"><div><div class="eyebrow">${t.name} · Season ${state.season} · Round ${state.round+1} of 12</div><h1>Make some<br><em>noise, ${esc(p.name.split(' ')[0])}.</em></h1><div class="subline">${state.history.length?`Last time out: ${state.history.at(-1).track} · P${state.history.at(-1).position}`:'Your first Grand Prix is just around the corner.'}</div></div><div class="pill">${t.name.toUpperCase()} / #${String(27+p.team).padStart(2,'0')}</div></div><div class="layout"><section><div class="panel"><div class="panel-head"><div class="panel-title">Next event</div><span class="eyebrow">ROUND ${String(state.round+1).padStart(2,'0')} / 12</span></div><div class="panel-body"><div class="track-card"><div class="track-name">${track[0]}</div><div class="track-meta" style="position:absolute;left:22px;top:55px">${track[1].toUpperCase()} · ${track[2]} KM</div><svg class="track-svg" viewBox="0 0 300 210"><path d="M42 133 C15 115 45 64 80 70 C105 74 105 107 135 107 C168 107 166 48 203 44 C242 40 270 81 246 105 C222 130 183 113 180 147 C177 178 230 180 255 155 C273 138 263 112 248 105"/><path class="inside" d="M42 133 C15 115 45 64 80 70 C105 74 105 107 135 107 C168 107 166 48 203 44 C242 40 270 81 246 105 C222 130 183 113 180 147 C177 178 230 180 255 155 C273 138 263 112 248 105"/></svg><div class="event-info"><div class="event-number">${String(state.round+1).padStart(2,'0')}</div><div class="weather">${track[4]}<br>${track[3]} LAPS · ${rnd(18,30)}°C<br>FORECAST: ${state.round%5===4?'LIGHT RAIN':state.round%7===2?'CHANGEABLE':'CLEAR'}</div></div></div><div class="stats-row"><div class="statbox"><label>Championship</label><strong>#${ordered.findIndex(d=>d===p)+1}</strong><span>${p.points} points</span></div><div class="statbox"><label>Wins</label><strong>${p.wins}</strong function createModal(){modal('Build your driver',`<p style="color:#aab5b0;font-size:13px;line-height:1.6;margin-top:0">The paddock will assess your profile and decide which teams are ready to take a chance. You do not choose your starting team.</p><form id="driverForm" class="form"><label>DRIVER NAME</label><input id="driverName" maxlength="24" required placeholder="e.g. Alex Morgan" value=""><label>DRIVING STYLE</label><select id="style"><option value="balanced">Balanced — reliable all-rounder</option><option value="qualifier">One-lap specialist — qualifying pace</option><option value="racer">Racecraft — overtaking and defence</option><option value="wet">Rain ace — wet-weather confidence</option></select><button class="btn" style="margin-top:12px">SUBMIT YOUR PROFILE →</button></form>`);document.querySelector('#driverForm').onsubmit=e=>{e.preventDefault();let name=$('#driverName').value.trim();if(name.length<2)return;const style=$('#style').value;let biases={balanced:{},qualifier:{qualifying:10,pace:4,consistency:-2},racer:{overtaking:12,defending:8,aggression:6},wet:{wet:16,consistency:4}}[style];let attrs={};ATTRS.forEach(a=>attrs[a]=clamp(rnd(52,76)+(biases[a]||0),30,94));let rating=Math.round(Object.values(attrs).reduce((a,b)=>a+b,0)/ATTRS.length);state.prospect={name,age:rnd(20,25),rating,experience:0,points:0,wins:0,podiums:0,rep:18,attrs};showOffers()}}

function raceFrame(now){if(!raceData||state.view!=='race'||raceData.done)return;let r=raceData,dt=Math.min(.05,(now-r.last)/1000);r.last=now;if(!r.paused){r.time+=dt;let k=r.keys,car=TEAMS[state.player.team].car,wet=r.weather==='RAIN';if(k.ArrowUp)r.speed+=dt*(car.accel*.36+27)*(1-r.fuel*.0015);else r.speed-=dt*18;if(k.ArrowDown)r.speed-=dt*75;if(k[' '])r.speed-=dt*45;r.speed=clamp(r.speed,0,320*(1-r.fuel*.00035));r.steer+=(Number(!!k.ArrowRight)-Number(!!k.ArrowLeft))*dt*2.7;r.steer*=Math.pow(.91,dt*60);if(Math.abs(r.steer)>1.05)r.offTrack+=dt;else r.offTrack=Math.max(0,r.offTrack-dt*.8);if(r.offTrack>.3){r.speed=Math.max(55,r.speed-dt*42);if(r.offTrack>1.3){r.damage=clamp(r.damage+dt*2,0,100);r.offTrack=0;r.message='OFF TRACK';r.messageTime=.8}}if(Math.abs(r.steer)>1.8){r.collisions++;r.damage=clamp(r.damage+7,0,100);r.steer*=.4;r.message='CONTACT';r.messageTime=.8}r.rivals.forEach(x=>{x.distance+=x.speed/3600*10*dt});let nearest=r.rivals.reduce((best,x)=>{let gap=x.distance-r.distance;return gap>0&&gap<best?gap:best},Infinity);r.dirtyAir=nearest<.65?clamp((.65-nearest)/.5,0,1):0;r.wear=clamp(r.wear+dt*(.11+(r.speed/320)*.09+(wet?.04:0)+r.dirtyAir*.035),0,100);r.fuel=clamp(r.fuel-dt*(.72+(r.speed/320)*.28),0,100);if(r.fuel===0){r.speed=Math.max(0,r.speed-dt*32);if(r.time>4&&r.speed<25){r.dnf=true;r.message='OUT OF FUEL';r.messageTime=3;finishRace(true);return}}if(r.failureTime>0){r.failureTime=Math.max(0,r.failureTime-dt);r.speed=Math.min(r.speed,170);if(r.failureTime===0)r.message='SYSTEMS CLEAR';}else if(!r.failure&&Math.random()<dt*(100-car.reliability)*.000018){r.failure=true;r.failureTime=2+rnd(1,3);r.message='MECHANICAL ISSUE';r.messageTime=1.5;if(Math.random()<.12+(100-car.reliability)*.002){r.dnf=true;r.message='ENGINE FAILURE';r.messageTime=3;finishRace(true);return}}let lapDist=TRACKS[state.round%12][2],scale=10*(1-r.wear*.003-r.damage*.004-(wet?.07:0)-r.dirtyAir*.012-(r.failureTime>0?.16:0));r.distance+=r.speed/3600*scale*dt;if(r.distance>=lapDist*4){r.distance=lapDist*4;finishRace(false);return}r.lap=Math.min(4,Math.floor(r.distance/lapDist)+1);if(r.messageTime>0)r.messageTime-=dt;else if(r.dirtyAir>.2)r.message='DIRTY AIR';else r.message='';}drawRace();updateHud();requestAnimationFrame(raceFrame)}
function drawRace(){let r=raceData,c=r.ctx,w=r.canvas.width,h=r.canvas.height,dpr=devicePixelRatio,progress=r.distance/(TRACKS[state.round%12][2]*4),steer=r.steer;c.save();c.scale(dpr,dpr);w/=dpr;h/=dpr;let sky=c.createLinearGradient(0,0,0,h*.6);sky.addColorStop(0,r.weather==='RAIN'?'#718b8a':'#5d8195');sky.addColorStop(1,'#c7c28e');c.fillStyle=sky;c.fillRect(0,0,w,h);c.fillStyle='#445747';c.fillRect(0,h*.48,w,h*.52);c.fillStyle='#78876a';c.fillRect(0,h*.48,w,h*.11);let horizon=h*.43,curve=Math.sin(progress*55+performance.now()/2600)*w*.12+steer*w*.1,roadW=Math.min(w*.92, w*.19+(h-horizon)*.85),center=w/2+curve;c.fillStyle='#d9d4b8';c.beginPath();c.moveTo(center-roadW*.59,h);c.lineTo(center-roadW*.19,horizon);c.lineTo(center+roadW*.19,horizon);c.lineTo(center+roadW*.59,h);c.closePath();c.fill();c.fillStyle='#343b3c';c.beginPath();c.moveTo(center-roadW*.52,h);c.lineTo(center-roadW*.17,horizon);c.lineTo(center+roadW*.17,horizon);c.lineTo(center+roadW*.52,h);c.closePath();c.fill();for(let i=0;i<14;i++){let z=((i/14+progress*4)%1),y=horizon+(h-horizon)*z*z,x=center+(w/2-center)*z*z,ww=roadW*(.18+.34*z*z);c.fillStyle=i%2?'#e7e2cf':'#ce5148';c.fillRect(x-ww,y,ww*.16,Math.max(1,2+z*13));c.fillRect(x+ww*.84,y,ww*.16,Math.max(1,2+z*13))}for(let i=0;i<8;i++){let y=horizon+(h-horizon)*Math.pow((i+1)/9,2),z=(y-horizon)/(h-horizon);c.fillStyle='#f0e9ce';c.fillRect(center-roadW*(.17+.35*z),y,roadW*(.34+.7*z),Math.max(1,z*3))}if(r.weather!=='CLEAR'){c.fillStyle='#ffffff18';for(let i=0;i<90;i++){let x=(i*173+performance.now()*.18)%w,y=(i*97+performance.now()*.42)%h;c.fillRect(x,y,1,7)}}if(r.view==='chase'){let x=w/2+steer*w*.08,y=h*.79;c.fillStyle='#171d1e';c.fillRect(x-w*.085,y+h*.035,w*.17,h*.045);c.fillStyle=TEAMS[state.player.team].color;c.beginPath();c.moveTo(x-w*.07,y);c.lineTo(x-w*.04,y-h*.09);c.lineTo(x+w*.04,y-h*.09);c.lineTo(x+w*.07,y);c.closePath();c.fill();c.fillRect(x-w*.11,y-h*.01,w*.22,h*.025);c.fillStyle='#f1edcf';c.fillRect(x-w*.04,y-h*.085,w*.08,h*.017);c.fillStyle='#111';c.fillRect(x-w*.055,y-h*.12,w*.11,h*.015)}else{c.fillStyle='#151b1c';c.fillRect(0,h*.78,w,h*.22);c.fillStyle='#879e96';c.fillRect(w*.35,h*.63,w*.3,h*.17);c.fillStyle='#202a2a';c.fillRect(w*.43,h*.68,w*.14,h*.09);c.fillStyle='#aab8a5';c.fillRect(w*.47,h*.69,w*.06,h*.045)}c.restore()}
function updateHud(){let r=raceData,wear=100-Math.round(r.wear),tyres=document.querySelectorAll('.tyre'),position=1+r.rivals.filter(x=>x.distance>r.distance).length;$('#hudSpeed').textContent=String(Math.round(r.speed)).padStart(3,'0');$('#hudGear').textContent=String(Math.min(7,Math.floor(r.speed/42)+1));$('#hudTiming').innerHTML=`LAP ${r.lap} / 4<br>${r.weather==='RAIN'?'WET':'DRY'} TYRES<br>FUEL ${Math.round(r.fuel)}% · AIR ${Math.round(r.dirtyAir*100)}%`;$('#hudWear').textContent=wear+'%';$('#hudDamage').textContent=Math.round(r.damage)+'%';tyres.forEach(x=>{x.className='tyre'+(wear<65?' worn':'')+(wear<30?' bad':'')});$('#hudMessage').textContent=r.message;$('#hudMessage').style.display=r.message?'block':'none';$('#raceClock').textContent=`${Math.floor(r.time/60)}:${String(Math.floor(r.time%60)).padStart(2,'0')}.${Math.floor(r.time%1*10)}`;$('#hudPos').innerHTML=`P<span>${position}</span><small>LIVE POSITION</small>`}
const POINTS=[25,18,15,12,10,8,6,4,2,1];
function finishRace(retired){let r=raceData;if(!r||r.done)return;r.done=true;r.retired=retired;unbindRaceControls();let list=state.drivers.filter(d=>d!==state.player).map(d=>{let car=TEAMS[d.team].car,score=d.rating*.48+car.speed*.12+car.corner*.15+car.reliability*.08+d.attrs.consistency*.08+rnd(-15,15);return{d,score}});let car=TEAMS[state.player.team].car;let playerScore=state.player.rating*.48+car.speed*.12+car.corner*.15+car.reliability*.08+state.player.attrs.consistency*.08+(100-r.wear)*.08-r.damage*.17-r.dirtyAir*6-(retired?100:0)+rnd(-8,8);list.push({d:state.player,score:playerScore});list.sort((a,b)=>b.score-a.score);let position=list.findIndex(x=>x.d===state.player)+1,points=retired?0:(POINTS[position-1]||0);if(position===1&&!retired)state.player.wins++;if(position<=3&&!retired)state.player.podiums++;state.player.points+=points;state.player.rep=clamp((state.player.rep||18)+(position<=3?7:position<=10?3:-2),0,100);state.player.races=(state.player.races||0)+1;state.player.experience=state.player.races;state.drivers.forEach(d=>{if(d!==state.player){let s=list.find(x=>x.d===d);let pos=list.findIndex(x=>x.d===d)+1;d.points+=POINTS[pos-1]||0;if(pos===1)d.wins++;if(pos<=3)d.podiums++}});let result={track:TRACKS[state.round%12][0],position,points,weather:r.weather,time:r.time,retired,wear:Math.round(r.wear),damage:Math.round(r.damage)};state.history.push(result);state.lastResult=result;save();renderResults(list,result)}
function renderResults(list,result){let p=state.player,round=state.round;$('#app').innerHTML=`<div class="race-screen" style="overflow:auto"><div class="race-top"><span><b>CHEQUERED FLAG</b> · ${esc(result.track.toUpperCase())}</span><span>SEASON ${state.season} · ROUND ${round+1}</span><span>${result.weather}</span></div><main class="wrap" style="width:min(980px,100%);margin:auto"><div class="hero"><div><div class="eyebrow">${result.retired?'DID NOT FINISH':'GRAND PRIX CLASSIFICATION'}</div><h1>${result.retired?'Tough':'P'+result.position}<br><em>${result.retired?'one to take':'race.'}</em></h1><div class="subline">${result.points} championship points · ${result.weather.toLowerCase()} conditions · ${Math.floor(result.time/60)}:${String(Math.floor(result.time%60)).padStart(2,'0')} race time</div></div><div class="pill">${esc(result.track.toUpperCase())}</div></div><div class="layout"><section><div class="panel"><div class="panel-head"><div class="panel-title">Race classification</div><span class="eyebrow">ROUND ${round+1}</span></div><div class="panel-body" style="padding:4px 14px"><table class="standings"><thead><tr><th>POS</th><th>DRIVER</th><th style="text-align:right">PTS</th></tr></thead><tbody>${standingsRows(list.map(x=>x.d))}</tbody></table></div></div><button class="btn race-cta" id="continue">${round===11?'Complete season':'Continue career'} →</button></section><aside><div class="panel"><div class="panel-head"><div class="panel-title">Race debrief</div></div><div class="panel-body"><div class="statbox"><label>TYRE WEAR</label><strong>${result.wear}%</strong></div><div class="statbox" style="margin-top:8px"><label>CAR DAMAGE</label><strong>${result.damage}%</strong></div><p style="font-size:12px;color:#9eaaa5;line-height:1.6">${result.position<=3?'Excellent drive — the paddock is talking.':result.position<=10?'Solid points finish. Keep building your reputation.':'Every lap is a lesson. Focus on clean lines and tyre care.'}</p></div></div></aside></div></main></div>`;$('#continue').onclick=advanceCareer}
function advanceCareer(){state.round++;if(state.round>=12){state.round=0;finishSeason()}state.view='home';delete state.lastResult;save();render()}
function finishSeason(){let p=state.player;p.age++;p.experience=(p.experience||0)+1;p.rep=clamp((p.rep||18)+Math.round((p.points-60)/15),0,100);let offers=TEAMS.map((t,i)=>({team:i,fit:clamp(Math.round(26+(p.rep-35)*.65+(Object.values(t.car).slice(0,6).reduce((a,b)=>a+b,0)/6-70)*.45+rnd(-10,10)),5,98)})).sort((a,b)=>b.fit-a.fit).slice(0,4);state.season++;state.round=0;state.drivers.forEach(d=>{if(d!==p){d.age++;if(d.age>39&&rnd(1,100)<28){d.age=21;d.name=NAMES[rnd(0,NAMES.length-1)]+' '+['Jr.','II',''][rnd(0,2)];d.rating=clamp(d.rating+rnd(-4,3),55,88);d.attrs={};ATTRS.forEach(a=>d.attrs[a]=clamp(d.rating+rnd(-14,13),22,98));d.points=0;d.wins=0;d.podiums=0}}d.points=0});p.points=0;state.drivers=state.drivers.slice(0,20);state.offers=offers;state.endSeason=true;save();setTimeout(()=>seasonOffers(),80)}
function seasonOffers(){let p=state.player,offers=state.offers||[],cards=offers.map(o=>{let t=TEAMS[o.team];return `<div class="contract-card"><div class="teamstripe" style="background:${t.color}"></div><div class="eyebrow">${o.team===p.team?'RENEWAL OFFER':'CONTRACT OFFER'} · FIT ${o.fit}%</div><h3>${t.name}</h3><p>${o.team===p.team?'Your current team wants you back.':'A new garage is interested in your services.'}</p><button class="btn season-sign" data-team="${o.team}" style="width:100%;background:${t.color}">${o.team===p.team?'RENEW CONTRACT':'MOVE TEAM'} →</button></div>`}).join('');modal(`Season ${state.season-1} complete`, `<p style="color:#aab5b0">You are now ${p.age}. Your reputation is ${p.rep}/100. Choose where to race next season.</p><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px">${cards}</div>`);document.querySelectorAll('.season-sign').forEach(b=>b.onclick=()=>{let team=+b.dataset.team;if(team!==p.team){let newmate=state.drivers.find(d=>d.team===team);let oldmate=state.drivers.find(d=>d.team===p.team&&d!==p);if(newmate){newmate.team=p.team;oldmate.team=team}p.team=team}state.endSeason=false;delete state.offers;save();document.querySelector('.modal-back')?.remove();render()})}
render();if(state.endSeason&&state.player)seasonOffers();
</script></body></html>
